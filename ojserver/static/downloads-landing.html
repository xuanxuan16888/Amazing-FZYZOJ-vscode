<!DOCTYPE html>

<title>Amazing FZYZOJ-vscode</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Microsoft YaHei','Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.container{text-align:center;padding:60px 40px;background:rgba(255,255,255,0.95);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,0.25);backdrop-filter:blur(10px);max-width:520px;width:90%}
.logo{width:120px;height:120px;margin:0 auto 24px;border-radius:28px;background:linear-gradient(135deg,#007acc,#00a3ff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:52px;font-weight:800;box-shadow:0 12px 30px rgba(0,122,204,0.35)}
.title{font-size:34px;font-weight:800;background:linear-gradient(135deg,#007acc,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;letter-spacing:-0.5px}
.subtitle{font-size:16px;color:#555;margin-bottom:12px}
.tagline{font-size:14px;color:#888;margin-bottom:40px;line-height:1.7}
.download-btn{display:inline-block;padding:16px 48px;background:linear-gradient(135deg,#007acc,#00a3ff);color:#fff;font-size:17px;font-weight:700;border:none;border-radius:12px;cursor:pointer;box-shadow:0 8px 24px rgba(0,122,204,0.3);transition:transform 0.15s ease,box-shadow 0.15s ease;text-decoration:none}
.download-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,122,204,0.4)}
.download-btn:active{transform:translateY(0)}
.meta{margin-top:32px;font-size:12px;color:#aaa}
.links{margin-top:20px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.links a{font-size:13px;color:#666;text-decoration:none;padding:6px 12px;border-radius:6px;background:#f3f4f6;transition:background 0.15s ease}
.links a:hover{background:#e5e7eb;color:#007acc}
</style>
</head>
<body>
<div class="container">
  <div class="logo">FZ</div>

  <a class="download-btn" href="/downloads">⬇  进入下载页</a>
  <div class="meta">服务器版本 · FZYZOJ 代理服务</div>
  <div class="links">
