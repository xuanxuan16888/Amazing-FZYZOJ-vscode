<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YZOJ 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#007acc,#005fa3);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:16px;padding:40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.login-box h1{text-align:center;font-size:24px;margin-bottom:8px;color:#007acc}
.login-box .subtitle{text-align:center;font-size:14px;color:#999;margin-bottom:30px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:6px}
.form-group input{width:100%;padding:12px 14px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px}
.form-group input:focus{outline:none;border-color:#007acc;box-shadow:0 0 0 3px rgba(0,122,204,0.1)}
.form-group textarea{width:100%;padding:12px 14px;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;resize:vertical;min-height:60px;font-family:monospace}
.form-group textarea:focus{outline:none;border-color:#007acc}
.tip{font-size:12px;color:#999;margin-bottom:20px;line-height:1.6}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.btn-primary{background:#007acc;color:#fff}
.btn-primary:hover{background:#005fa3}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed}
.error-msg{color:#dc3545;font-size:13px;margin-top:8px;text-align:center;display:none}
.loading{text-align:center;padding:20px}
.loading .spinner{width:24px;height:24px;border:3px solid #e0e0e0;border-top-color:#007acc;border-radius:50%;animation:spin 1s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="login-box" id="loginBox">
    <h1>YZOJ 用户登录</h1>
    <div class="subtitle">使用 YZOJ Cookie 登录代理服务器</div>
    <div class="form-group">
        <label>YZOJ Cookie</label>
        <textarea id="cookieInput" placeholder="请输入 YZOJ 的完整 Cookie 值"></textarea>
    </div>
    <div class="tip">
        获取方法：<br>
        1. 登录 YZOJ 网站<br>
        2. 按 F12 打开开发者工具<br>
        3. 在 Network 或 Application 标签找到 Cookie<br>
        4. 复制完整的 Cookie 值粘贴到上方
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">登录</button>
    <div class="error-msg" id="errorMsg"></div>
</div>
<div class="loading" id="loadingBox" style="display:none">
    <div class="spinner"></div>
    <p style="margin-top:12px;color:#666">正在验证身份...</p>
</div>

<script>
const baseUrl = window.location.origin;

async function doLogin() {
    const cookie = document.getElementById('cookieInput').value.trim();
    if (!cookie) {
        showError('请输入 Cookie');
        return;
    }
    
    hideError();
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('loadingBox').style.display = 'block';
    document.getElementById('loginBtn').disabled = true;
    
    try {
        const res = await fetch(`${baseUrl}/api/user/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({yzoj_cookie: cookie})
        });
        const data = await res.json();
        
        if (data.success) {
            localStorage.setItem('userToken', data.token);
            localStorage.setItem('userUid', data.uid);
            localStorage.setItem('userName', data.username);
            localStorage.setItem('isAdmin', data.is_admin ? '1' : '0');
            localStorage.setItem('userColor', data.user_color || '#2563EB');
            localStorage.setItem('permissionLevel', data.permission_level || '0');
            
            // 跳转到个人主页
            window.location.href = `/user.html?uid=${data.uid}`;
        } else {
            showError(data.message || '登录失败');
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('loadingBox').style.display = 'none';
            document.getElementById('loginBtn').disabled = false;
        }
    } catch (e) {
        showError('网络错误: ' + e.message);
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('loginBtn').disabled = false;
    }
}

function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
}

function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
}

// 检查是否已登录
async function checkSession() {
    const token = localStorage.getItem('userToken');
    if (!token) return;
    
    try {
        const res = await fetch(`${baseUrl}/api/user/check`, {
            headers: {'X-User-Token': token}
        });
        const data = await res.json();
        
        if (data.logged_in) {
            // 已登录，跳转到个人主页
            window.location.href = `/user.html?uid=${data.uid}`;
        } else {
            // Token失效，清除本地存储
            localStorage.removeItem('userToken');
            localStorage.removeItem('userUid');
            localStorage.removeItem('userName');
            localStorage.removeItem('isAdmin');
        }
    } catch (e) {
        console.error('检查登录状态失败:', e);
    }
}

checkSession();
</script>
</body>
</html>
