<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YZOJ 用户个人主页</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1f2328;background:linear-gradient(180deg,#f2f5fa 0%,#eef1f7 40%,#eef1f7 100%);min-height:100vh}
a{text-decoration:none;color:inherit}

/* ===== Nav Bar ===== */
.nav-bar{background:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eef1f6;position:sticky;top:0;z-index:100;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.nav-bar .nav-left{display:flex;align-items:center;gap:16px}
.nav-bar .nav-left a{color:#0969da;text-decoration:none;font-size:14px;font-weight:500}
.nav-bar .nav-left a:hover{text-decoration:underline}
.nav-bar .user-info{display:flex;align-items:center;gap:12px;font-size:14px}
.nav-bar .avatar-small{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.nav-bar .is-admin{padding:2px 8px;background:#f85149;color:#fff;border-radius:999px;font-size:11px;font-weight:600}
.nav-bar .btn-link{background:none;border:none;color:#0969da;cursor:pointer;font-size:14px;padding:0}
.nav-bar .btn-link:hover{text-decoration:underline}
.nav-bar .admin-btn{padding:6px 14px;background:#f85149;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;display:none;align-items:center;gap:4px}
.nav-bar .admin-btn:hover{background:#e0443c}
.nav-bar .admin-btn.visible{display:inline-flex}
.login-btn-main{padding:7px 18px;background:linear-gradient(135deg,#0969da,#0550ae);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.login-btn-main:hover{filter:brightness(1.08)}

/* ===== Layout ===== */
.wrap{max-width:720px;margin:0 auto;padding:18px 20px}
.single-col{display:block;}

/* ===== Card ===== */
.card{background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(28,54,89,.05);overflow:hidden;margin-bottom:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #eef1f6}
.cht{font-weight:600;color:#1f2328;font-size:14px}
.cht svg{vertical-align:-3px;margin-right:6px}
.chm{font-size:12px;color:#656d76;font-weight:400;margin-left:4px}

/* ===== Profile Card ===== */
.profile-card .banner{height:180px;position:relative;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.profile-card .banner.hdr{background-size:cover;background-position:center}
.profile-card .bcover{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.18) 100%)}
.header-upload-btn{position:absolute;bottom:10px;right:14px;padding:5px 12px;background:rgba(0,0,0,0.55);color:#fff;border-radius:7px;cursor:pointer;font-size:12px;border:none;display:none;align-items:center;gap:4px;backdrop-filter:blur(6px);font-weight:500}
.header-upload-btn:hover{background:rgba(0,0,0,.75)}
.header-upload-btn.visible{display:inline-flex}

.pf-row{padding:0 24px 16px;position:relative}
.avwrap{width:108px;height:108px;border-radius:50%;border:5px solid #fff;background:#eef1f6;margin-top:-56px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.av{width:100%;height:100%;object-fit:cover;display:block}
.avph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#8b949e;background:linear-gradient(135deg,#e0e7ff,#ede9fe)}
.avatar-upload-btn{position:absolute;bottom:4px;right:4px;width:32px;height:32px;background:#0969da;color:#fff;border-radius:50%;border:3px solid #fff;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:16px;line-height:1;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.avatar-upload-btn:hover{background:#0550ae}
.avatar-upload-btn.visible{display:flex}

.pf-main{margin-top:14px}
.pf-uname-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.pf-uname{font-size:26px;font-weight:800;letter-spacing:.2px}
.ptag{display:inline-block;padding:3px 10px;border-radius:999px;color:#fff;font-size:11px;font-weight:600;vertical-align:middle}
.ptag.ban{background:#f85149}
.pf-nick{font-size:14px;color:#474d57;margin-top:3px}
.pf-sub{font-size:13px;color:#57606a;margin-top:2px}
.pf-sig{font-size:14px;color:#6e7681;margin-top:10px;font-style:italic;border-left:3px solid #d0d7de;padding:2px 0 2px 12px;line-height:1.65}

.pf-details{padding:14px 24px 4px;border-top:1px solid #f1f3f6;margin-top:4px}
.pfd{font-size:13px;color:#474d57;padding:7px 0;display:flex;align-items:center}
.pfd svg{fill:#57606a;margin-right:8px;vertical-align:-2px;flex-shrink:0}
.pf-bio{padding:10px 24px 20px}
.pf-bio-h{font-size:12.5px;color:#656d76;margin-bottom:8px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.pf-bio-b{font-size:14px;line-height:1.75;color:#24292f;background:#f7f9fc;border-radius:12px;padding:14px 16px}
.pf-bio-b img{max-width:100%;border-radius:6px}
.pf-bio-b p{margin-bottom:10px}
.pf-bio-b p:last-child{margin-bottom:0}
.pf-bio-b a{color:#0969da}
.pf-bio-b ul,.pf-bio-b ol{padding-left:24px;margin:8px 0}
.pf-bio-b code{background:#eef1f6;padding:1px 6px;border-radius:5px;font-size:12.5px}

/* ===== Modal ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(3px)}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;width:90%;max-width:520px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:popIn .18s ease-out}
@keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:19px;margin-bottom:18px;color:#1f2328;font-weight:700}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:#474d57;margin-bottom:6px;font-weight:500}
.form-group input[type="text"],.form-group textarea{width:100%;padding:10px 12px;border:1px solid #dbe4ef;border-radius:9px;font-size:14px;font-family:inherit;transition:border-color .12s,box-shadow .12s;background:#fff}
.form-group textarea{resize:vertical;min-height:110px;line-height:1.6}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.1)}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn{padding:8px 18px;border:none;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;transition:filter .12s}
.btn:hover{filter:brightness(1.05)}
.btn-primary{background:linear-gradient(135deg,#0969da,#0550ae);color:#fff}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;filter:none}
.btn-secondary{background:#f1f3f6;color:#474d57}
.btn-secondary:hover{background:#e6ebf1}
.btn-danger{background:#f85149;color:#fff}
.btn-danger:hover{background:#e0443c}
.mini-btn{padding:5px 12px;background:#f1f3f6;border:none;border-radius:7px;color:#474d57;font-size:12px;cursor:pointer;font-weight:500}
.mini-btn:hover{background:#e6ebf1}
.preview-box{background:#f7f9fc;border-radius:9px;padding:12px;margin-top:8px;font-size:13px;color:#24292f;max-height:200px;overflow-y:auto;line-height:1.7;border:1px solid #eef1f6}
.preview-label{font-size:11px;color:#656d76;margin-top:10px;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.image-preview{max-width:100%;max-height:180px;border-radius:9px;margin-top:8px;border:3px solid #eef1f6}
.hidden{display:none !important}

/* ===== Loading / Toast / States ===== */
.loading-wrap{text-align:center;padding:50px 20px;color:#8b949e}
.loading-wrap .spinner{display:inline-block;width:32px;height:32px;border:3px solid #eef1f6;border-top-color:#0969da;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-tip{font-size:14px;color:#656d76;margin-top:6px}
.error-wrap{text-align:center;padding:50px 20px;color:#f85149;background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);padding:11px 22px;background:#1f2328;color:#fff;border-radius:10px;font-size:14px;z-index:9999;opacity:0;transition:opacity .22s,transform .22s;box-shadow:0 6px 20px rgba(0,0,0,.2);font-weight:500}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#f85149}
.toast.success{background:#2ea043}
</style>
</head>
<body>
<div class="nav-bar">
    <div class="nav-left">
        <a href="/">← 返回首页</a>
    </div>
    <div class="user-info" id="navUserInfo" style="display:none">
        <button class="admin-btn" id="navAdminBtn" onclick="goToAdmin()">⚙️ 控制台</button>
        <div class="avatar-small" id="navAvatar"></div>
        <span id="navUsername"></span>
        <span class="is-admin" id="navAdminBadge" style="display:none">Admin</span>
        <button class="btn-link" onclick="logout()">退出登录</button>
    </div>
    <div id="navLoginBtn">
        <button class="login-btn-main" onclick="showLoginModal()">登录</button>
    </div>
</div>

<div class="wrap" id="mainWrap">
    <div class="loading-wrap" id="loadingState">
        <div class="spinner"></div>
        <div style="font-size:15px;color:#24292f;font-weight:500">正在加载用户主页...</div>
        <div class="loading-tip">正在从 YZOJ 获取用户数据和活动折线图，请稍候...</div>
    </div>
</div>

<input type="file" id="avatarFileInput" accept="image/*" class="hidden">
<input type="file" id="headerFileInput" accept="image/*" class="hidden">

<!-- ===== Login Modal ===== -->
<div class="modal-overlay" id="loginModal">
    <div class="modal">
        <h2>🔐 登录 YZOJ</h2>
        <div class="form-group">
            <label>YZOJ Cookie</label>
            <input type="text" id="loginCookie" placeholder="请输入 YZOJ 的 Cookie（PHPSESSID 等）">
        </div>
        <p style="font-size:12px;color:#8b949e;margin-bottom:12px;line-height:1.6">
            请登录 YZOJ 官网后，在浏览器开发者工具 → Network 中复制请求的 Cookie 完整值。<br>
            登录后系统会生成一个新的 Token 用于本代理服务器的身份验证。
        </p>
        <div class="form-actions">
            <button class="btn btn-secondary" onclick="closeLoginModal()">取消</button>
            <button class="btn btn-primary" onclick="doLogin()">登录</button>
        </div>
    </div>
</div>

<!-- ===== Edit Profile Modal ===== -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h2>✏️ 编辑个人资料</h2>
        <div class="form-group">
            <label>头像</label>
            <div style="display:flex;align-items:center;gap:12px">
                <img id="editAvatarPreview" src="" style="width:60px;height:60px;border-radius:50%;object-fit:cover;background:#f0f0f0">
                <button class="btn btn-secondary" onclick="document.getElementById('editAvatarInput').click()">更换头像</button>
                <input type="file" id="editAvatarInput" accept="image/*" style="display:none" onchange="handleAvatarChange(this)">
            </div>
        </div>
        <div class="form-group">
            <label>头图（封面）</label>
            <div style="display:flex;align-items:center;gap:12px">
                <img id="editHeaderPreview" src="" style="width:120px;height:40px;border-radius:6px;object-fit:cover;background:#f0f0f0">
                <button class="btn btn-secondary" onclick="document.getElementById('editHeaderInput').click()">更换头图</button>
                <input type="file" id="editHeaderInput" accept="image/*" style="display:none" onchange="handleHeaderChange(this)">
            </div>
        </div>
        <div class="form-group">
            <label>个性签名</label>
            <input type="text" id="editSignature" placeholder="输入个性签名（一行）">
        </div>
        <div class="form-group">
            <label>个人简介（支持 Markdown + LaTeX 公式）</label>
            <textarea id="editBio" placeholder="示例：&#10;## 关于我&#10;我是一名 OI 选手，擅长算法和数据结构。&#10;$$E = mc^2$$"></textarea>
            <div class="preview-label">实时预览</div>
            <div class="preview-box" id="bioPreview" style="min-height:60px">（在此显示预览）</div>
        </div>
        <div class="form-actions">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" id="saveBtn" onclick="saveProfile()">保存</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===========================
 *  Utility & Global
 * =========================== */
const baseUrl = window.location.origin;
let currentUsername = '';
let currentUid = '';
let userToken = localStorage.getItem('userToken') || '';
let currentUser = null;
let profileData = null;
let newAvatarData = null;
let newHeaderData = null;
let currentAvatarUrl = '';
let currentHeaderUrl = '';
let _userOjBase = 'https://oj.fzyz.moe'; // fallback, replaced by fetched data

function getUrlParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(message, type='info') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast ' + type + ' show';
    setTimeout(() => { toast.className = 'toast'; }, 3000);
}

/* ===========================
 *  User Color System
 * =========================== */
function yzojUserColor(solvedCount) {
    solvedCount = parseInt(solvedCount) || 0;
    if (solvedCount === -2 || solvedCount < 0) return '#999999'; // 封禁
    if (solvedCount >= 1200) return '#FF0000'; // Lv10
    if (solvedCount >= 800)  return '#FF6700'; // Lv9
    if (solvedCount >= 500)  return '#FFB400'; // Lv8
    if (solvedCount >= 300)  return '#A7A700'; // Lv7
    if (solvedCount >= 180)  return '#008C8C'; // Lv6
    if (solvedCount >= 100)  return '#00B100'; // Lv5
    if (solvedCount >= 50)   return '#009846'; // Lv4
    if (solvedCount >= 25)   return '#007AD9'; // Lv3
    if (solvedCount >= 8)    return '#0F72B8'; // Lv2
    return '#2563EB';                           // Lv1 最低
}

/* ===========================
 *  Login / Auth
 * =========================== */
async function checkLogin() {
    if (!userToken) return null;
    try {
        const res = await fetch(`${baseUrl}/api/user/check`, {
            headers: {'X-User-Token': userToken}
        });
        const data = await res.json();
        if (data.logged_in) {
            currentUser = data;
            return data;
        } else {
            // Token 已失效（DB 中不存在或被清），清理 localStorage
            // 防止下次刷新继续带无效 token 导致一直未登录
            userToken = '';
            localStorage.removeItem('userToken');
            currentUser = null;
        }
    } catch (e) { console.error('检查登录失败:', e); }
    return null;
}

async function doLogin() {
    const cookie = document.getElementById('loginCookie').value.trim();
    if (!cookie) { showToast('请输入 Cookie', 'error'); return; }
    try {
        const res = await fetch(`${baseUrl}/api/user/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({yzoj_cookie: cookie})
        });
        const data = await res.json();
        if (data.success) {
            userToken = data.token;
            localStorage.setItem('userToken', userToken);
            currentUser = data;
            showToast('登录成功', 'success');
            closeLoginModal();
            updateLoginUI();
            updateEditButtons();
        } else {
            showToast(data.message || '登录失败', 'error');
        }
    } catch (e) { showToast('登录失败: ' + e.message, 'error'); }
}

// 管理员模拟用户：切换回管理员模式
async function unimpersonate() {
    const adminBackupToken = sessionStorage.getItem('admin_token_backup');
    // 删除用户 session
    try {
        await fetch(`${baseUrl}/api/admin/unimpersonate`, {
            method:'POST',
            headers:{ 'Content-Type':'application/json', 'X-Admin-Token': adminBackupToken || '' },
            body: JSON.stringify({ user_token: userToken })
        });
    } catch(e) {}
    // 清理本地状态
    if (userToken) {
        try { await fetch(`${baseUrl}/api/user/logout`, {method:'POST', headers:{'X-User-Token':userToken}}); } catch(e) {}
    }
    userToken = '';
    localStorage.removeItem('userToken');
    sessionStorage.removeItem('admin_token_backup');
    currentUser = null;
    // 跳回管理页
    window.location.href = '/admin.html';
}

async function logout() {
    if (userToken) {
        try { await fetch(`${baseUrl}/api/user/logout`, {method:'POST', headers:{'X-User-Token':userToken}}); } catch(e) {}
    }
    userToken = '';
    localStorage.removeItem('userToken');
    currentUser = null;
    showToast('已退出登录', 'success');
    updateLoginUI();
    updateEditButtons();
}

function showLoginModal() {
    document.getElementById('loginModal').classList.add('active');
    document.getElementById('loginCookie').value = '';
}
function closeLoginModal() { document.getElementById('loginModal').classList.remove('active'); }

function goToAdmin() { window.location.href = '/admin.html'; }

function updateLoginUI() {
    const navUserInfo = document.getElementById('navUserInfo');
    const navLoginBtn = document.getElementById('navLoginBtn');
    // 兼容两种情况：user/check 返回 logged_in=true，或 user/login 成功返回包含 token 的 data
    const isLoggedIn = !!(currentUser && (currentUser.logged_in || currentUser.token));
    if (isLoggedIn) {
        navUserInfo.style.display = 'flex';
        navLoginBtn.style.display = 'none';
        const uname = currentUser.username || '?';
        const avEl = document.getElementById('navAvatar');
        const avUrl = currentUser.avatar_url || currentUser.avatarUrl || '';
        if (avUrl) {
            avEl.innerHTML = '<img src="'+esc(avUrl)+'" style="width:28px;height:28px;border-radius:50%;object-fit:cover;display:block" onerror="this.style.display=\'none\';this.parentElement.textContent=\''+esc(uname.charAt(0).toUpperCase())+'\'">';
        } else {
            avEl.textContent = uname.charAt(0).toUpperCase();
        }
        document.getElementById('navUsername').textContent = uname;
        document.getElementById('navAdminBadge').style.display = currentUser.is_admin ? 'inline-block' : 'none';
        document.getElementById('navAdminBtn').classList.toggle('visible', !!currentUser.is_admin);
    } else {
        navUserInfo.style.display = 'none';
        navLoginBtn.style.display = 'block';
    }
}

/* ===========================
 *  Profile Card
 * =========================== */
function renderProfileCard(data) {
    // solvedCount: strict null check, preserve 0 value
    let solvedCount = 0;
    if (data.solvedCount !== undefined && data.solvedCount !== null) solvedCount = parseInt(data.solvedCount) || 0;
    else if (data.solved_count !== undefined && data.solved_count !== null) solvedCount = parseInt(data.solved_count) || 0;
    else if (data.solved !== undefined && data.solved !== null) solvedCount = parseInt(data.solved) || 0;

    let submissionCount = 0;
    if (data.submissionCount !== undefined && data.submissionCount !== null) submissionCount = parseInt(data.submissionCount) || 0;
    else if (data.submission_count !== undefined && data.submission_count !== null) submissionCount = parseInt(data.submission_count) || 0;
    else if (data.submissions !== undefined && data.submissions !== null) submissionCount = parseInt(data.submissions) || 0;

    // username: avoid pure numeric UID
    const _rawUsername = data.username || '';
    const _uid = data.uid || data.id || data.uuid || '';
    let username = 'User';
    if (_rawUsername && String(_rawUsername).trim() && !/^\d+$/.test(String(_rawUsername).trim())) {
        username = String(_rawUsername).trim();
    } else if (_rawUsername && String(_rawUsername).trim()) {
        username = String(_rawUsername).trim();
    }
    if (!username || /^\d+$/.test(String(username).trim())) {
        username = 'User #' + (_uid || String(username).trim() || '0');
    }

    // User color: prefer YZOJ parsed color from login/session, fallback to calculated color
    const parsedColor = data.user_color || (currentUser && currentUser.user_color) || '';
    const userColor = parsedColor || yzojUserColor(data.isBanned || data.is_banned ? -2 : solvedCount);
    const nickname = data.nickname || '';
    const realName = data.realName || data.real_name || '';
    const signature = data.signature || '';
    const avUrl = data.avatar_url || data.avatarUrl || '';
    const hdrImg = data.header_image_url || '';
    const isBanned = !!data.isBanned || !!data.is_banned;
    const tags = data.tags || [];
    const school = data.school || '';
    const email = data.email || '';
    const uid = _uid;
    const bioHtml = data.bio_html || '';
    const bio = data.bio || '';

    currentAvatarUrl = avUrl;
    currentHeaderUrl = hdrImg;

    // Banner
    const banner =
        '<div class="banner ' + (hdrImg ? 'hdr' : '') + '" ' + (hdrImg ? ('style="background-image:url(' + esc(hdrImg) + ')"') : '') + '>' +
            '<div class="bcover"></div>' +
        '</div>';

    // Avatar
    let avInner = '';
    if (avUrl) {
        avInner =

    const userSvg = '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 1a4 4 0 00-4 4c0 1.6 1 3 2.4 3.6C4.3 9.3 3 11 3 13h10c0-2-1.3-3.7-3.4-4.4A4 4 0 008 1zm0 2a2 2 0 110 4 2 2 0 010-4z"/></svg>';
    let details = '';
    if (school) details += '<div class="pfd">' + schSvg + esc(school) + '</div>';
    if (email)  details += '<div class="pfd">' + mailSvg + esc(email) + '</div>';
    if (username) details += '<div class="pfd">' + userSvg + '用户名: ' + esc(String(username)) + '</div>';

    );

/* ===========================
 *  Markdown + KaTeX Inline Renderer
 * =========================== */
/* ===========================
 *  Math & Markdown Rendering
 *  Order: extract math → marked → KaTeX
 *  This prevents markdown's HTML escaping (e.g. > → &gt;)
 *  from corrupting math expressions.
 * =========================== */

// Extract $$...$$ and $...$ from raw text, replace with \x00MATHn\x00 placeholders
function _extractMath(text) {
    var blocks = [];
    var result = '';
    var i = 0;
    while (i < text.length) {
        var d = text.indexOf('$', i);
        if (d === -1) { result += text.substring(i); break; }
        result += text.substring(i, d);
        if (d + 1 < text.length && text[d + 1] === '$') {
            var c = text.indexOf('$$', d + 2);
            if (c !== -1) {
                blocks.push(text.substring(d + 2, c));
                result += '\x00M' + (blocks.length - 1) + '\x00';
                i = c + 2;
            } else { result += text.substring(d); break; }
        } else {
            var c = text.indexOf('$', d + 1);
            if (c !== -1) {
                blocks.push(text.substring(d + 1, c));
                result += '\x00m' + (blocks.length - 1) + '\x00';
                i = c + 1;
            } else { result += text.substring(d); break; }
        }
    }
    return { text: result, blocks: blocks };
}

// Reinsert KaTeX-rendered math into marked output
function _reinsertMath(html, blocks) {
    for (var j = 0; j < blocks.length; j++) {
        var ph;
        var math = blocks[j].trim();
        // Try display math first ($$ → \x00M)
        ph = '\x00M' + j + '\x00';
        try {
            html = html.split(ph).join(katex.renderToString(math, {throwOnError: false, displayMode: true}));
        } catch(e) {
            html = html.split(ph).join(esc('$$' + math + '$$'));
        }
        // Try inline math ($ → \x00m)
        ph = '\x00m' + j + '\x00';
        try {
            html = html.split(ph).join(katex.renderToString(math, {throwOnError: false}));
        } catch(e) {
            html = html.split(ph).join(esc('$' + math + '$'));
        }
    }
    return html;
}

// For bio: full markdown + math rendering
function renderMarkdownInline(text) {
    if (!text) return '';
    // 1. Extract math first (protect from markdown escaping)
    var extracted = _extractMath(text);
    // 2. Run marked on non-math text
    var html = '';
    try { html = marked.parse(extracted.text, { html: false, breaks: true, gfm: true }) || ''; }
    catch(e) { html = '<p>' + esc(extracted.text) + '</p>'; }
    // 3. Reinsert KaTeX rendered math
    return _reinsertMath(html, extracted.blocks);
}

// For signature: inline math only (no markdown), HTML-escape non-math parts
function renderInlineKaTeX(text) {
    if (!text) return '';
    // 1. Extract math first
    var extracted = _extractMath(text);
    // 2. HTML-escape non-math parts
    var escaped = esc(extracted.text);
    // 3. Reinsert KaTeX rendered math into the escaped HTML
    return _reinsertMath(escaped, extracted.blocks);
}

/* ===========================
 *  Activity Chart (YZOJ native Morris.Area style)
 * =========================== */
const YZOJ_LV_COLORS_WEB = ['#8CE600','#A6E600','#BFE600','#D9E600','#E6D900','#E6BF00','#E6A600','#E68C00','#CC0000','#0073E6'];
const YZOJ_LV_LABELS_WEB = ['Lv.1','Lv.2','Lv.3','Lv.4','Lv.5','Lv.6','Lv.7','Lv.8','Lv.9','Lv.10'];

function _normalizeActivityDataWeb(ad) {
    if (!ad || !Array.isArray(ad)) return [];
    const out = [];
    const dateKeys = ['period', 'date', 'day', 'time'];
    for (let i = 0; i < ad.length; i++) {
        const row = ad[i];
        if (!row || typeof row !== 'object') continue;
        let d = '';
        for (let k = 0; k < dateKeys.length; k++) {
            if (row[dateKeys[k]] !== undefined) { d = String(row[dateKeys[k]]); break; }
        }
        if (!d) continue;
        const r = {period: d, total: 0};
        for (let lv = 1; lv <= 10; lv++) {
            let v = 0;
            if (row[String(lv)] !== undefined && row[String(lv)] !== null) v = parseInt(row[String(lv)]) || 0;
            r['lv'+lv] = v; r.total += v;
        }
        if (r.total <= 0 && row['total'] !== undefined && row['total'] !== null) {
            r.total = parseInt(row['total']) || 0;
        }
        if (r.total > 0) out.push(r);
    }
    out.sort((a, b) => a.period < b.period ? -1 : 1);
    return out;
}

function renderActivityChartWeb(activityData) {
    const rows = _normalizeActivityDataWeb(activityData);
    const n = rows.length;
    // YZOJ Morris.Area 折线图数据是「截至该时间点的累计 AC 数」，非当月增量。
    // 因此总 AC 数取所有行的 total 最大值（即最新的累计值），而非逐行累加。
    let totalAC = 0;
    for (let i = 0; i < n; i++) {
        const tv = (rows[i].total || 0);
        if (tv > totalAC) totalAC = tv;
    }
    const iconSvg = '<svg viewBox="0 0 16 16" width="16" height="16" style="vertical-align:-3px;margin-right:6px;fill:#2563eb"><path d="M2 2h1v12h12v1H2V2zm2 9h2v3H4v-3zm3-5h2v8H7V6zm3 3h2v5h-2V9zm3-6h2v11h-2V3z"/></svg>';
    const header = '<div class="card-head"><div class="cht">' + iconSvg + '活动统计 · 按难度分层累积 <span class="chm">(YZOJ 原生 Morris.Area)</span></div><div class="chm">总 AC <b style="color:#d4a72c">' + totalAC + '</b> 次</div></div>';
    if (!n) {
        return '<div class="card hm-card">' + header + '<div style="padding:36px 16px;text-align:center;color:#8b949e">暂无活动数据</div></div>';
    }
    const W = 720, H = 260, padL = 48, padR = 18, padT = 18, padB = 38;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    let yMax = 0;
    for (let i = 0; i < n; i++) { const s = rows[i].total || 0; if (s > yMax) yMax = s; }
    if (yMax <= 0) yMax = 1;
    const niceSteps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
    let niceMax = niceSteps[niceSteps.length - 1];
    for (let s = 0; s < niceSteps.length; s++) if (niceSteps[s] >= yMax) { niceMax = niceSteps[s]; break; }
    if (yMax > niceMax) niceMax = Math.ceil(yMax / 50) * 50;
    yMax = niceMax;
    const xAt = (ii) => padL + (n === 1 ? plotW / 2 : (ii / (n - 1)) * plotW);
    const yVal = (vv) => padT + plotH - (Math.min(vv, yMax) / yMax) * plotH;
    let gridLines = ''; const yTicks = 4;
    for (let t = 0; t <= yTicks; t++) {
        const yv = padT + plotH * (t / yTicks);
        const label = Math.round(yMax - (yMax * t / yTicks));
        gridLines += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yv + '" y2="' + yv + '" stroke="#e6e8eb" stroke-width="1" stroke-dasharray="3 3"/>';
        gridLines += '<text x="' + (padL - 6) + '" y="' + (yv + 4) + '" text-anchor="end" font-size="10" fill="#8b949e">' + label + '</text>';
    }
    let xLabels = '';
    let lastMM = -1, lastYY = -1;
    for (let i = 0; i < n; i++) {
        const m = /^(\d{4})\-(\d{2})/.exec(rows[i].period);
        if (!m) continue;
        const yy = parseInt(m[1]), mm = parseInt(m[2]);
        if (mm !== lastMM || yy !== lastYY) {
            lastMM = mm; lastYY = yy;
            const x = xAt(i);
            xLabels += '<line x1="' + x + '" x2="' + x + '" y1="' + (padT + plotH) + '" y2="' + (padT + plotH + 4) + '" stroke="#8b949e" stroke-width="1"/>';
            xLabels += '<text x="' + x + '" y="' + (padT + plotH + 18) + '" text-anchor="middle" font-size="11" fill="#6e7781">' + yy + '/' + mm + '</text>';
        }
    }
    const cum = new Array(n);
    for (let i = 0; i < n; i++) cum[i] = 0;
    let layerSvg = '';
    for (let lv = 1; lv <= 10; lv++) {
        let areaD = '';
        for (let i = 0; i < n; i++) {
            const xx = xAt(i);
            const cur = cum[i] + (rows[i]['lv'+lv] || 0);
            const yy = yVal(cur);
            if (i === 0) { areaD = 'M' + padL + ',' + yVal(0) + ' L' + xx + ',' + yy; }
            else { areaD += ' L' + xx + ',' + yy; }
        }
        areaD += ' L' + xAt(n-1) + ',' + (padT + plotH) + ' L' + padL + ',' + (padT + plotH) + ' Z';
        let lineD = '';
        for (let i = 0; i < n; i++) {
            const xx = xAt(i);
            const cur = cum[i] + (rows[i]['lv'+lv] || 0);
            const yy = yVal(cur);
            lineD += (i === 0 ? 'M' : 'L') + xx + ',' + yy + ' ';
        }
        layerSvg = '<path d="' + areaD + '" fill="' + YZOJ_LV_COLORS_WEB[lv-1] + '" fill-opacity="0.9" stroke="none"/>' + layerSvg;
        layerSvg += '<path d="' + lineD + '" fill="none" stroke="' + YZOJ_LV_COLORS_WEB[lv-1] + '" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>';
        for (let i = 0; i < n; i++) cum[i] += (rows[i]['lv'+lv] || 0);
    }
    let hover = '';
    for (let i = 0; i < n; i++) {
        const xx = xAt(i);
        const xPr = i === 0 ? padL : (xx + xAt(i-1)) / 2;
        const xNe = i === n-1 ? (W - padR) : (xx + xAt(i+1)) / 2;
        const ww = Math.max(1, xNe - xPr);
        let tip = rows[i].period + '&#10;总计: ' + (rows[i].total || 0);
        for (let lv = 1; lv <= 10; lv++) tip += '&#10;Lv.' + lv + ': ' + (rows[i]['lv'+lv] || 0);
        hover += '<rect x="' + xPr + '" y="' + padT + '" width="' + ww + '" height="' + plotH + '" fill="transparent"><title>' + esc(tip) + '</title></rect>';
    }
    let legend = '<div class="heatmap-legend" style="display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:8px 4px 4px">';
    for (let lv = 10; lv >= 1; lv--) {
        legend += '<span style="display:inline-flex;align-items:center;font-size:11px;color:#656d76;margin:0 4px"><span class="hm-cell" style="display:inline-block;width:14px;height:8px;background:' + YZOJ_LV_COLORS_WEB[lv-1] + ';border-radius:2px;margin-right:4px"></span>' + YZOJ_LV_LABELS_WEB[lv-1] + '</span>';
    }
    legend += '</div>';
    const svg = '<div style="overflow-x:auto;padding:4px 8px 0"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:100%;height:auto">' +
        gridLines + xLabels +
        layerSvg +
        hover +
        '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + (padT + plotH) + '" y2="' + (padT + plotH) + '" stroke="#8b949e" stroke-width="1"/>' +
        '</svg></div>';
    return '<div class="card hm-card">' + header + '<div class="hm-body" style="padding:4px 8px 8px">' + svg + legend + '</div></div>';
}

/* ===========================
 *  Solved Problems Card
 * =========================== */
function difficultyLabel(d) {
    d = parseFloat(d) || 0;
    if (d >= 10) return 'Lv.10+';
    if (d >= 9) return 'Lv.9';
    if (d >= 8) return 'Lv.8';
    if (d >= 7) return 'Lv.7';
    if (d >= 6) return 'Lv.6';
    if (d >= 5) return 'Lv.5';
    if (d >= 4) return 'Lv.4';
    if (d >= 3) return 'Lv.3';
    if (d >= 2) return 'Lv.2';
    if (d >= 1) return 'Lv.1';
    if (d > 0) return 'Entry';
    return '已解决';
}
function difficultyColorWeb(diff) {
    diff = parseFloat(diff) || 0;
    if (diff <= 0) {
        return '#6e7781';
    } else if (diff < 1.5) {
        const t = diff / 1.5;
        const r = Math.round(140 + (166 - 140) * t);
        const g = Math.round(230 + (230 - 230) * t);
        const b = Math.round(0 + (0 - 0) * t);
        return 'rgb(' + r + ',' + g + ',0)';
    } else if (diff < 2.5) {
        const t = (diff - 1.5) / 1.0;
        const r = Math.round(166 + (191 - 166) * t);
        const g = Math.round(230 + (230 - 230) * t);
        return 'rgb(' + r + ',' + g + ',0)';
    } else if (diff < 3.5) {
        const t = (diff - 2.5) / 1.0;
        const r = Math.round(191 + (217 - 191) * t);
        const g = Math.round(230 + (230 - 230) * t);
        return 'rgb(' + r + ',' + g + ',0)';
    } else if (diff < 4.5) {
        const t = (diff - 3.5) / 1.0;
        const r = Math.round(217 + (230 - 217) * t);
        const g = Math.round(230 + (217 - 230) * t);
        const b = Math.round(0 + (0 - 0) * t);
        return 'rgb(' + r + ',' + g + ',' + b + ')';
    } else if (diff < 5.5) {
        const t = (diff - 4.5) / 1.0;
        const r = Math.round(230 + (230 - 230) * t);
        const g = Math.round(217 + (191 - 217) * t);
        return 'rgb(' + r + ',' + g + ',0)';
    } else if (diff < 6.5) {
        const t = (diff - 5.5) / 1.0;
        const r = Math.round(230 + (230 - 230) * t);
        const g = Math.round(191 + (166 - 191) * t);
        return 'rgb(' + r + ',' + g + ',0)';
    } else if (diff < 7.5) {
        const t = (diff - 6.5) / 1.0;
        const r = Math.round(230 + (230 - 230) * t);
        const g = Math.round(166 + (140 - 166) * t);
        return 'rgb(' + r + ',' + g + ',0)';
    } else if (diff < 8.5) {
        const t = (diff - 7.5) / 1.0;
        const r = Math.round(230 + (204 - 230) * t);
        const g = Math.round(140 + (0 - 140) * t);
        const b = Math.round(0 + (0 - 0) * t);
        return 'rgb(' + r + ',' + g + ',' + b + ')';
    } else if (diff < 9.5) {
        return '#CC0000';
    } else {
        return '#0073E6';
    }
}
function renderSolvedProblemsCard(solvedProblems) {
    if (!solvedProblems || !solvedProblems.length) return '';
    const headSolved = '<div class="card-head"><div class="cht"><svg viewBox="0 0 16 16" width="16" height="16" style="vertical-align:-3px;margin-right:6px;fill:#0969da"><path d="M8 0L2 5l1.4 1.4L7 3.8V13h2V3.8l3.6 2.6L14 5 8 0z"/></svg>已解决题目 <span class="chm">(' + solvedProblems.length + ' 题)</span></div></div>';
    let body = '<div class="sp-grid">';
    // 不再按难度排序/着色，统一按题号升序，使用统一配色
    const unifiedBg = '#2563eb';
    const unifiedFg = '#fff';
    solvedProblems.slice().sort(function (a, bb) {
        const ida = parseInt(a.id) || 0;
        const idb = parseInt(bb.id) || 0;
        return ida - idb;
    }).forEach(function (p) {
        const tip = 'P' + p.id + (p.title ? ' · ' + p.title : '');
        const url = p.url || (baseUrl.replace('/ojs', '') + '/OnlineJudge/problem_show.php?id=' + p.id);
        body += '<a class="sp-cell" href="' + esc(url) + '" target="_blank" style="background:' + unifiedBg + ';color:' + unifiedFg + ';border-color:' + unifiedBg + '" title="' + esc(tip) + '"><span class="sp-id">P' + esc(p.id) + '</span></a>';
    });
    body += '</div>';
    return '<div class="card solved-card">' + headSolved + body + '</div>';
}

/* ===========================
 *  Fetch User Data (using NEW /api/user/profile/full)
 * =========================== */
async function fetchUserData() {
    const uid = getUrlParam('uid') || getUrlParam('user_id') || '';
    const uname = getUrlParam('username') || getUrlParam('uname') || '';
    currentUid = uid;
    const wrap = document.getElementById('mainWrap');
    wrap.innerHTML =
        '<div class="loading-wrap">' +
            '<div class="spinner"></div>' +
            '<div style="font-size:15px;color:#24292f;font-weight:500">正在加载用户主页...</div>' +
            '<div class="loading-tip">正在从 YZOJ 获取用户数据，请稍候...</div>' +
        '</div>';

    const params = new URLSearchParams();
    if (uid) params.set('uid', uid);
    else if (uname) params.set('username', uname);
    else params.set('uid', '1');

    profileData = null;
    let fetchError = null;

    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s timeout for profile only
        const token = localStorage.getItem('userToken');
        const headers = {};
        if (token) {
            headers['X-User-Token'] = token;
        }
        const res = await fetch(`${baseUrl}/api/user/profile/full?${params.toString()}`, {signal: controller.signal, headers: headers});
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        profileData = await res.json();
        // If server indicates user session expired (YZOJ cookie no longer valid), log out locally
        if (profileData && profileData.session_expired) {
            userToken = '';
            localStorage.removeItem('userToken');
            currentUser = null;
            console.warn('YZOJ Cookie expired, user logged out');
        }
    } catch (e) {
        fetchError = e;
        console.error('加载用户数据失败:', e);
    }

    // Fallback: try old separate APIs
    if (!profileData && (uid || uname)) {
        try {
            const keyParam = uid ? ('uid=' + encodeURIComponent(uid)) : ('username=' + encodeURIComponent(uname));
            const [p1, p2] = await Promise.all([
                fetch(`${baseUrl}/api/user/profile/detail?${keyParam}`).catch(()=>null),
                fetch(`${baseUrl}/api/user/profile?${keyParam}`).catch(()=>null),
            ]);
            const prof = p1 && p1.ok ? await p1.json().catch(()=>({})) : {};
            const det  = p2 && p2.ok ? await p2.json().catch(()=>({})) : {};

            const solvedCount = det.solved_count !== undefined ? det.solved_count :
                               (prof.solvedCount !== undefined ? prof.solvedCount :
                                (prof.solved !== undefined ? prof.solved : 0));
            const submissionCount = det.submission_count !== undefined ? det.submission_count :
                                   (prof.submissionCount !== undefined ? prof.submissionCount :
                                    (prof.submissions !== undefined ? prof.submissions : 0));

            profileData = Object.assign({}, det, prof, {
                solvedCount: solvedCount,
                submissionCount: submissionCount,
                realName: det.realname || prof.realName || '',
                isBanned: !!det.is_banned || !!prof.is_banned,
            });
            // Try tags
            try {
                const tres = await fetch(`${baseUrl}/api/user/tags?${keyParam}`);
                if (tres.ok) {
                    const tdata = await tres.json().catch(()=>({}));
                    if (tdata.tags) profileData.tags = tdata.tags;
                }
            } catch(_) {}
        } catch(e2) {
            if (!fetchError) fetchError = e2;
        }
    }

    if (!profileData) {
        wrap.innerHTML =
            '<div class="error-wrap">' +
                '<div style="font-size:36px;margin-bottom:12px">😢</div>' +
                '<div style="font-size:17px;font-weight:600;color:#1f2328;margin-bottom:8px">加载用户数据失败</div>' +
                '<div style="font-size:13px;color:#656d76">错误信息：' + esc(fetchError ? fetchError.message : '未知错误') + '</div>' +
            '</div>';
        return;
    }

    currentUsername = profileData.username || profileData.name || uname || uid || 'User';
    currentUid = profileData.uid || profileData.id || uid || '';
    document.title = currentUsername + ' · YZOJ 个人主页';

    let activityHtml = '';
    if (profileData.activityData && profileData.activityData.length > 0) {
        activityHtml = renderActivityChartWeb(profileData.activityData);
    }

    wrap.innerHTML =
        '<div class="single-col">' +
            renderProfileCard(profileData) +
            activityHtml +
        '</div>';

    // Attach edit & upload handlers
    bindEditButtons();
    updateEditButtons();
}

/* ===========================
 *  Edit Button & Upload Handling
 * =========================== */
function updateEditButtons() {
    const editBtn = document.getElementById('editBtn');
    if (!editBtn) return;

    const canEdit = currentUser && (
        currentUser.is_admin ||
        String(currentUser.username || '').toLowerCase() === String(currentUsername || '').toLowerCase() ||
        String(currentUser.uid || currentUser.id || '') === String(currentUid || '')
    );
    if (canEdit) {
        editBtn.style.display = 'flex';
    } else {
        editBtn.style.display = 'none';
    }
}

function bindEditButtons() {
    const editBtn = document.getElementById('editBtn');
    if (editBtn) editBtn.addEventListener('click', openEditModal);
}

/* Modal edit */
async function openEditModal() {
    if (!currentUser) { showToast('请先登录', 'error'); showLoginModal(); return; }
    
    // Clear fields first
    document.getElementById('editSignature').value = '';
    document.getElementById('editBio').value = '';
    document.getElementById('editAvatarPreview').src = '';
    document.getElementById('editHeaderPreview').src = '';
    pendingAvatarData = null;
    pendingHeaderData = null;

    const kp = currentUid ? ('uid='+encodeURIComponent(currentUid)) : ('username='+encodeURIComponent(currentUsername));
    
    // Helper: try to construct media URL from known path as final fallback
    function _mediaFallbackUrl(type) {
        const key = currentUid || currentUsername || '';
        if (!key) return '';
        return baseUrl + '/media/' + encodeURIComponent(key) + '/' + type + '.png';
    }
    
    // Load existing profile data from local database (仿照 admin.html)
    let avatarSrc = '';
    let headerSrc = '';
    try {
        const r = await fetch(`${baseUrl}/api/user/profile/detail?${kp}`);
        if (r.ok) {
            const d = await r.json() || {};
            avatarSrc = d.avatar_url || '';
            headerSrc = d.header_image_url || '';
            document.getElementById('editSignature').value = d.signature || '';
            document.getElementById('editBio').value = d.bio || '';
        }
    } catch(_) {
        const domSig = (document.querySelector('.pf-sig')?.textContent || '').trim();
        if (domSig && !document.getElementById('editSignature').value) {
            document.getElementById('editSignature').value = domSig;
        }
    }
    // Fallback: use profileData for signature/bio if detail API returned empty
    if (!document.getElementById('editSignature').value) {
        document.getElementById('editSignature').value = profileData?.signature || '';
    }
    if (!document.getElementById('editBio').value) {
        document.getElementById('editBio').value = profileData?.bio || '';
    }
    // Fallback for avatar/header: profileData → direct media path
    if (!avatarSrc) avatarSrc = profileData?.avatar_url || profileData?.avatarUrl || _mediaFallbackUrl('avatar');
    if (!headerSrc) headerSrc = profileData?.header_image_url || _mediaFallbackUrl('header');
    document.getElementById('editAvatarPreview').src = avatarSrc;
    document.getElementById('editHeaderPreview').src = headerSrc;
    
    // Record original values for partial update detection
    _origSignature = document.getElementById('editSignature').value;
    _origBio = document.getElementById('editBio').value;
    renderMarkdownPreview();
    document.getElementById('editModal').classList.add('active');
}

let pendingAvatarData = null;
let pendingHeaderData = null;

// Track original values for partial update in edit modal
let _origSignature = '';
let _origBio = '';

function handleAvatarChange(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const dataUrl = e.target.result;
        document.getElementById('editAvatarPreview').src = dataUrl;
        pendingAvatarData = dataUrl.split(',')[1]; // Remove "data:image/...;base64," prefix
    };
    reader.readAsDataURL(file);
}

function handleHeaderChange(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const dataUrl = e.target.result;
        document.getElementById('editHeaderPreview').src = dataUrl;
        pendingHeaderData = dataUrl.split(',')[1]; // Remove "data:image/...;base64," prefix
    };
    reader.readAsDataURL(file);
}

function closeModal() { document.getElementById('editModal').classList.remove('active'); }

document.getElementById('editBio').addEventListener('input', renderMarkdownPreview);
function renderMarkdownPreview() {
    const val = document.getElementById('editBio').value;
    const el = document.getElementById('bioPreview');
    if (!val || !val.trim()) { el.innerHTML = '<span style="color:#8b949e;font-style:italic">（暂无内容）</span>'; return; }
    el.innerHTML = renderMarkdownInline(val);
}

async function saveProfile() {
    if (!currentUser) { showToast('请先登录', 'error'); return; }
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = '保存中...';

    const signature = document.getElementById('editSignature').value;
    const bio = document.getElementById('editBio').value;
    let bioHtml = renderMarkdownInline(bio);

    try {
        const updateTarget = currentUid || currentUsername || '';

        // Upload avatar if changed
        if (pendingAvatarData) {
            try {
                const avRes = await fetch(`${baseUrl}/api/user/profile/upload`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json', 'X-User-Token': userToken},
                    body: JSON.stringify({username: updateTarget, type: 'avatar', data: pendingAvatarData})
                });
                const avResult = await avRes.json();
                if (!avResult || !avResult.success) {
                    showToast('头像上传失败', 'error');
                    saveBtn.disabled = false;
                    saveBtn.textContent = '保存';
                    return;
                }
            } catch(e) {
                showToast('头像上传失败: ' + e.message, 'error');
                saveBtn.disabled = false;
                saveBtn.textContent = '保存';
                return;
            }
        }

        // Upload header if changed
        if (pendingHeaderData) {
            try {
                const hdRes = await fetch(`${baseUrl}/api/user/profile/upload`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json', 'X-User-Token': userToken},
                    body: JSON.stringify({username: updateTarget, type: 'header', data: pendingHeaderData})
                });
                const hdResult = await hdRes.json();
                if (!hdResult || !hdResult.success) {
                    showToast('头图上传失败', 'error');
                    saveBtn.disabled = false;
                    saveBtn.textContent = '保存';
                    return;
                }
            } catch(e) {
                showToast('头图上传失败: ' + e.message, 'error');
                saveBtn.disabled = false;
                saveBtn.textContent = '保存';
                return;
            }
        }

        // Save signature and bio
        const payload = {
            username: updateTarget,
            signature: signature,
            bio: bio,
            bio_html: bioHtml,
        };
        const res = await fetch(`${baseUrl}/api/user/profile/update`, {
            method: 'POST',
            headers: {'Content-Type':'application/json', 'X-User-Token': userToken},
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result && result.success) {
            showToast('保存成功', 'success');
            closeModal();
            fetchUserData();
        } else {
            showToast('保存失败: ' + (result && result.message ? result.message : '未知错误'), 'error');
        }
    } catch(err) {
        showToast('保存失败: ' + err.message, 'error');
    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '保存';
    }
}

async function uploadMedia(type, base64Data) {
    if (!currentUser) throw new Error('未登录');
    const target = currentUid || currentUsername || '';
    try {
        const res = await fetch(`${baseUrl}/api/user/profile/upload`, {
            method: 'POST',
            headers: {'Content-Type':'application/json', 'X-User-Token': userToken},
            body: JSON.stringify({username: target, type: type, data: base64Data})
        });
        return await res.json();
    } catch(e) { console.error('上传失败:', e); throw e; }
}

/* Click outside modals to close */
window.addEventListener('click', function(e) {
    if (e.target === document.getElementById('editModal')) closeModal();
    if (e.target === document.getElementById('loginModal')) closeLoginModal();
});
/* ESC to close modals */
window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeModal(); closeLoginModal(); }
});

/* ===========================
 *  Init
 * =========================== */
async function init() {
    // 先读取 URL 参数（uid/username），判断是否指定了用户
    const q_uid = getUrlParam('uid') || getUrlParam('user_id') || '';
    const q_uname = getUrlParam('username') || getUrlParam('uname') || '';
    const hasTargetUser = !!(q_uid || q_uname);

    currentUser = await checkLogin();
    const isLoggedIn = !!(currentUser && currentUser.logged_in);
    updateLoginUI();

    // 检测是否处于管理员模拟用户模式
    const adminBackupToken = sessionStorage.getItem('admin_token_backup');
    const impersonating = !!(adminBackupToken && userToken && isLoggedIn);
    if (impersonating) {
        document.getElementById('impersonateBar').style.display = 'flex';
        document.getElementById('impersonateText').textContent = '正在模拟用户 ' + (currentUser.username || '') + '（管理员）';
        document.body.classList.add('impersonating');
    }

    // 情况 1：用户没有指定目标（没带 uid/username 参数，直接访问 /user.html）
    if (!hasTargetUser) {
        if (!isLoggedIn) {
            // 未登录且没有指定用户 → 跳登录页
            window.location.href = '/login.html';
            return;
        } else {
            // 已登录且没有指定用户 → 跳转到当前登录用户的个人主页（带上参数）
            const u = currentUser.uid || currentUser.username || '';
            if (u) {
                const sep = '?';
                const qs = currentUser.uid
                    ? ('uid=' + encodeURIComponent(currentUser.uid))
                    : ('username=' + encodeURIComponent(currentUser.username));
                window.history.replaceState(null, '', sep + qs);
                // 更新到 URL 后 fetchUserData 就能从 query 里取到正确的 uid/username
            }
        }
    }

    try { await fetchUserData(); }
    catch(e) {
        console.error('init error', e);
        const wrap = document.getElementById('mainWrap');
        wrap.innerHTML = '<div class="error-wrap">加载失败：' + esc(e.message) + '</div>';
    }
}
init();
</script>
