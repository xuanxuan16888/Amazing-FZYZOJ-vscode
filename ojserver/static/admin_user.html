<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YZOJ 用户管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;background:#f5f7fa;color:#333}
.nav-bar{background:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e0e0e0}
.nav-bar .nav-left{display:flex;align-items:center;gap:16px}
.nav-bar .nav-left a{color:#007acc;text-decoration:none;font-size:14px}
.nav-bar .nav-left a:hover{text-decoration:underline}
.nav-bar .nav-left h2{font-size:18px;color:#333}
.nav-bar .user-info{display:flex;align-items:center;gap:12px;font-size:14px}
.nav-bar .user-info .avatar-small{width:28px;height:28px;border-radius:50%;background:#ff6b6b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.nav-bar .btn-link{background:none;border:none;color:#007acc;cursor:pointer;font-size:14px;padding:0}
.nav-bar .btn-link:hover{text-decoration:underline}
.container{max-width:1200px;margin:20px auto;padding:0 20px}
.search-bar{background:#fff;border-radius:12px;padding:16px;margin-bottom:20px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.search-bar input{padding:10px 14px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;width:300px}
.search-bar input:focus{outline:none;border-color:#007acc}
.search-bar button{padding:10px 20px;background:#007acc;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.search-bar button:hover{background:#005fa3}
.user-table{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.user-table h3{font-size:16px;margin-bottom:16px;color:#333}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #e8eaed}
th{background:#f8f9fa;font-weight:600;color:#555;font-size:13px}
td{font-size:14px}
tr:hover{background:#f5f8fc}
.user-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#007acc;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.user-link{color:#007acc;text-decoration:none;cursor:pointer}
.user-link:hover{text-decoration:underline}
.btn-edit{padding:6px 12px;background:#007acc;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer}
.btn-edit:hover{background:#005fa3}
.btn-sm{padding:4px 10px;font-size:12px;background:#f0f0f0;color:#666;border:none;border-radius:4px;cursor:pointer}
.btn-sm:hover{background:#e0e0e0}
.pagination{display:flex;justify-content:center;gap:8px;margin-top:20px}
.pagination button{padding:8px 16px;background:#fff;border:1px solid #e0e0e0;border-radius:6px;cursor:pointer}
.pagination button:hover{background:#f0f0f0}
.pagination button.active{background:#007acc;color:#fff;border-color:#007acc}
.pagination button:disabled{opacity:0.5;cursor:not-allowed}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;width:90%;max-width:600px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.modal h2{font-size:20px;margin-bottom:20px;color:#333}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:6px}
.form-group input[type="text"],.form-group textarea{width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit}
.form-group textarea{resize:vertical;min-height:80px}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:#007acc}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn{padding:8px 20px;border:none;border-radius:8px;font-size:14px;cursor:pointer}
.btn-primary{background:#007acc;color:#fff}
.btn-primary:hover{background:#005fa3}
.btn-secondary{background:#f0f0f0;color:#666}
.btn-secondary:hover{background:#e0e0e0}
.btn-danger{background:#dc3545;color:#fff}
.btn-danger:hover{background:#c82333}
.image-preview{max-width:100%;max-height:150px;border-radius:8px;margin-top:8px}
.hidden{display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 24px;background:#333;color:#fff;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity 0.3s}
.toast.show{opacity:1}
.toast.error{background:#dc3545}
.toast.success{background:#28a745}
.no-data{text-align:center;padding:40px;color:#999}
</style>
</head>
<body>
<div class="nav-bar">
    <div class="nav-left">
        <a href="/">← 返回首页</a>
        <h2>用户管理后台</h2>
    </div>
    <div class="user-info">
        <div class="avatar-small">A</div>
        <span id="navUsername">Admin</span>
        <button class="btn-link" onclick="goToProfile()">我的主页</button>
        <button class="btn-link" onclick="logout()">退出</button>
    </div>
</div>

<div class="container">
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索用户编号或昵称...">
        <button onclick="searchUsers()">搜索</button>
        <button class="btn-sm" onclick="loadUsers()">刷新</button>
    </div>
    
    <div class="user-table">
        <h3>用户列表</h3>
        <table id="userTable">
            <thead>
                <tr>
                    <th>头像</th>
                    <th>编号</th>
                    <th>昵称</th>
                    <th>签名</th>
                    <th>简介</th>
                    <th>更新时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="userList">
                <tr><td colspan="7" class="no-data">加载中...</td></tr>
            </tbody>
        </table>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h2>编辑用户资料 - <span id="editUsername"></span></h2>
        <div class="form-group">
            <label>用户编号</label>
            <input type="text" id="editUid" readonly style="background:#f0f0f0">
        </div>
        <div class="form-group">
            <label>头像 URL</label>
            <input type="text" id="editAvatar" placeholder="头像图片URL">
        </div>
        <div class="form-group">
            <label>头图 URL</label>
            <input type="text" id="editHeader" placeholder="头图图片URL">
        </div>
        <div class="form-group">
            <label>个性签名</label>
            <input type="text" id="editSignature" placeholder="个性签名">
        </div>
        <div class="form-group">
            <label>个人简介</label>
            <textarea id="editBio" placeholder="个人简介（支持Markdown）"></textarea>
        </div>
        <div style="margin-top:20px"><h3>用户标签</h3>
          <div id="tags-container" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px"></div>
          <div style="display:flex;gap:6px">
            <input id="new-tag-input" placeholder="标签名称" style="flex:1;padding:6px">
            <input id="new-tag-color" type="color" value="#6366f1" style="width:40px;height:34px;padding:2px">
            <button onclick="addTag()" style="padding:6px 12px;background:#4f46e5;color:#fff;border:none;border-radius:4px;cursor:pointer">添加</button>
          </div></div>
        <div class="form-actions">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-danger" onclick="clearProfile()">清空</button>
            <button class="btn btn-primary" onclick="saveProfile()">保存</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const baseUrl = window.location.origin;
let userToken = localStorage.getItem('userToken') || '';
let currentUser = null;
let currentPage = 1;
let currentKeyword = '';

function showToast(message, type='info') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast ' + type + ' show';
    setTimeout(() => { toast.className = 'toast'; }, 3000);
}

async function checkAdmin() {
    if (!userToken) {
        window.location.href = '/login.html';
        return false;
    }
    try {
        const res = await fetch(`${baseUrl}/api/user/check`, {
            headers: {'X-User-Token': userToken}
        });
        const data = await res.json();
        if (!data.logged_in) {
            localStorage.removeItem('userToken');
            window.location.href = '/login.html';
            return false;
        }
        if (!data.is_admin) {
            showToast('权限不足，只有管理员可以访问', 'error');
            setTimeout(() => { window.location.href = `/user.html?uid=${data.uid}`; }, 2000);
            return false;
        }
        currentUser = data;
        document.getElementById('navUsername').textContent = data.username;
        return true;
    } catch (e) {
        console.error('检查登录失败:', e);
        window.location.href = '/login.html';
        return false;
    }
}

async function logout() {
    if (userToken) {
        try {
            await fetch(`${baseUrl}/api/user/logout`, {
                method: 'POST',
                headers: {'X-User-Token': userToken}
            });
        } catch (e) {}
    }
    localStorage.removeItem('userToken');
    window.location.href = '/login.html';
}

function goToProfile() {
    if (currentUser) {
        window.location.href = `/user.html?uid=${currentUser.uid}`;
    }
}

async function loadUsers(page=1) {
    currentPage = page;
    const tbody = document.getElementById('userList');
    tbody.innerHTML = '<tr><td colspan="7" class="no-data">加载中...</td></tr>';
    
    try {
        const url = `${baseUrl}/api/admin/users/list?page=${page}&keyword=${encodeURIComponent(currentKeyword)}&page_size=20`;
        const res = await fetch(url, {headers: {'X-User-Token': userToken}});
        const data = await res.json();
        
        if (data.error) {
            tbody.innerHTML = `<tr><td colspan="7" class="no-data">${data.error}</td></tr>`;
            return;
        }
        
        if (data.users && data.users.length > 0) {
            tbody.innerHTML = data.users.map(u => {
                const initial = (u.nickname || u.username || '?').charAt(0).toUpperCase();
                const profile = u.profile || {};
                return `
                <tr>
                    <td><div class="user-avatar">${initial}</div></td>
                    <td><span class="user-link" onclick="viewProfile('${u.username}')">${u.username}</span></td>
                    <td>${u.nickname || '-'}</td>
                    <td>${(profile.signature || '').substring(0,30) || '-'}</td>
                    <td>${(profile.bio || '').substring(0,50) || '-'}</td>
                    <td>${u.last_crawled || '-'}</td>
                    <td><button class="btn-edit" onclick="editUser('${u.username}')">编辑</button></td>
                </tr>
                `;
            }).join('');
            
            renderPagination(data.total_pages, page);
        } else {
            tbody.innerHTML = '<tr><td colspan="7" class="no-data">暂无用户数据</td></tr>';
        }
    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="no-data">加载失败: ${e.message}</td></tr>`;
    }
}

function renderPagination(totalPages, current) {
    const div = document.getElementById('pagination');
    div.innerHTML = '';
    
    if (totalPages <= 1) return;
    
    const prev = document.createElement('button');
    prev.textContent = '上一页';
    prev.disabled = current === 1;
    prev.onclick = () => loadUsers(current - 1);
    div.appendChild(prev);
    
    for (let i = 1; i <= Math.min(totalPages, 5); i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = i === current ? 'active' : '';
        btn.onclick = () => loadUsers(i);
        div.appendChild(btn);
    }
    
    if (totalPages > 5) {
        const span = document.createElement('span');
        span.textContent = `... ${totalPages}`;
        span.style.margin = '0 8px';
        div.appendChild(span);
    }
    
    const next = document.createElement('button');
    next.textContent = '下一页';
    next.disabled = current === totalPages;
    next.onclick = () => loadUsers(current + 1);
    div.appendChild(next);
}

async function searchUsers() {
    currentKeyword = document.getElementById('searchInput').value.trim();
    currentPage = 1;
    await loadUsers(1);
}

function viewProfile(uid) {
    window.location.href = `/user.html?uid=${uid}`;
}

async function editUser(uid) {
    document.getElementById('editUid').value = uid;
    document.getElementById('editUsername').textContent = uid;
    
    try {
        const res = await fetch(`${baseUrl}/api/user/profile/detail?username=${uid}`, {
            headers: {'X-User-Token': userToken}
        });
        const profile = await res.json();
        
        document.getElementById('editAvatar').value = profile.avatar_url || '';
        document.getElementById('editHeader').value = profile.header_image_url || '';
        document.getElementById('editSignature').value = profile.signature || '';
        document.getElementById('editBio').value = profile.bio || '';
    } catch (e) {
        showToast('加载用户资料失败', 'error');
    }
    
    document.getElementById('editModal').classList.add('active');
    loadTags(uid);
}

function closeModal() {
    document.getElementById('editModal').classList.remove('active');
}

async function saveProfile() {
    const uid = document.getElementById('editUid').value;
    
    const profileData = {
        username: uid,
        avatar_url: document.getElementById('editAvatar').value,
        header_image_url: document.getElementById('editHeader').value,
        signature: document.getElementById('editSignature').value,
        bio: document.getElementById('editBio').value
    };
    
    try {
        const res = await fetch(`${baseUrl}/api/user/profile/update`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-User-Token': userToken},
            body: JSON.stringify(profileData)
        });
        const result = await res.json();
        
        if (result.success) {
            showToast('保存成功', 'success');
            closeModal();
            loadUsers(currentPage);
        } else {
            showToast('保存失败: ' + result.message, 'error');
        }
    } catch (e) {
        showToast('保存失败: ' + e.message, 'error');
    }
}

async function clearProfile() {
    const uid = document.getElementById('editUid').value;
    
    if (!confirm('确定要清空该用户的所有资料吗？')) return;
    
    const profileData = {
        username: uid,
        avatar_url: '',
        header_image_url: '',
        signature: '',
        bio: '',
        bio_html: ''
    };
    
    try {
        const res = await fetch(`${baseUrl}/api/user/profile/update`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-User-Token': userToken},
            body: JSON.stringify(profileData)
        });
        const result = await res.json();
        
        if (result.success) {
            showToast('已清空', 'success');
            closeModal();
            loadUsers(currentPage);
        } else {
            showToast('清空失败: ' + result.message, 'error');
        }
    } catch (e) {
        showToast('清空失败: ' + e.message, 'error');
    }
}

window.addEventListener('click', function(e) {
    if (e.target === document.getElementById('editModal')) closeModal();
});

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function loadTags(username){
  fetch('/api/user/tags?username='+encodeURIComponent(username))
    .then(r=>r.json()).then(d=>{
      var c=document.getElementById('tags-container');
      if(!c)return;
      c.innerHTML='';
      (d.tags||[]).forEach(function(t){
        var el=document.createElement('span');
        el.style.cssText='display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;color:#fff;background:'+(t.color||'#6366f1');
        el.innerHTML=escapeHtml(t.tag)+' <span onclick="deleteTag(\''+escapeHtml(t.username)+'\',\''+escapeHtml(t.tag)+'\')" style="cursor:pointer;opacity:.7;margin-left:2px">&times;</span>';
        c.appendChild(el);
      });
    });
}
function addTag(){
  var inp=document.getElementById('new-tag-input');
  var tag=inp.value.trim();
  if(!tag)return;
  var color=document.getElementById('new-tag-color').value;
  var username=document.getElementById('editUid').value;
  fetch('/api/user/tags/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username,tag:tag,color:color})})
    .then(r=>r.json()).then(d=>{if(d.success){inp.value='';loadTags(username);}else alert(d.error||'失败');});
}
function deleteTag(username,tag){
  if(!confirm('确定删除标签 "'+tag+'" 吗？'))return;
  fetch('/api/user/tags/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username,tag:tag})})
    .then(r=>r.json()).then(d=>{if(d.success)loadTags(username);else alert(d.error||'失败');});
}

async function init() {
    const isAdmin = await checkAdmin();
    if (isAdmin) {
        await loadUsers();
    }
}

init();
</script>
</body>
</html>
